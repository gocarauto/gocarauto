services:
  # Backend API
  backend:
    build: .
    container_name: gocar-backend
    ports:
      - "3000:3000"
    volumes:
      - ./database:/app/database
      - ./public:/app/public
      - ./.env:/app/.env
      - ./routes:/app/routes
      - ./utils:/app/utils
      - ./middleware:/app/middleware
      - ./controllers:/app/controllers
      - ./config:/app/config
      - ./server.js:/app/server.js
      - ./package.json:/app/package.json
    environment:
      - NODE_ENV=development
    command: npm run dev
    networks:
      - gocar-network
    restart: unless-stopped

  # Staff Interface
  staff-interface:
    build: ./staff-interface
    container_name: gocar-staff-interface
    ports:
      - "5173:5173"
    volumes:
      - ./staff-interface/src:/app/src
      - ./staff-interface/public:/app/public
      - ./staff-interface/index.html:/app/index.html
    environment:
      - VITE_API_URL=http://localhost:3000/api
    networks:
      - gocar-network
    depends_on:
      - backend
    restart: unless-stopped

  # Customer Portal
  customer-portal:
    build: ./customer-portal
    container_name: gocar-customer-portal
    ports:
      - "5174:5174"
    volumes:
      - ./customer-portal/src:/app/src
      - ./customer-portal/public:/app/public
      - ./customer-portal/index.html:/app/index.html
    environment:
      - VITE_API_URL=http://localhost:3000/api
    networks:
      - gocar-network
    depends_on:
      - backend
    restart: unless-stopped

  # Production MySQL Database with Releem Optimization Tuning
  db:
    image: mysql:8.0
    container_name: gocar-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_password}
      MYSQL_DATABASE: ${DB_NAME:-gocar_auto}
      MYSQL_USER: ${DB_USER:-gocar_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-your_secure_db_password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./config/mysql-tuned.cnf:/etc/mysql/conf.d/releem-tuned.cnf:ro
      - ./database/schema.mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - gocar-network
    profiles:
      - mysql
      - full

  # Releem Agent (https://github.com/Releem/releem-agent)
  # AI-powered database performance tuning & metrics collection
  releem-agent:
    image: releem/releem-agent:latest
    container_name: gocar-releem-agent
    restart: unless-stopped
    environment:
      - RELEEM_API_KEY=${RELEEM_API_KEY:-}
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=${DB_USER:-gocar_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-your_secure_db_password}
      - MYSQL_DATABASE=${DB_NAME:-gocar_auto}
    depends_on:
      - db
    networks:
      - gocar-network
    profiles:
      - releem
      - full

volumes:
  mysql-data:
    driver: local

networks:
  gocar-network:
    driver: bridge
